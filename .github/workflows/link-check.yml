name: Link Check (Scheduled)

on:
  schedule:
    # Every Sunday at 02:00 UTC — weekly, not on every PR
    # (avoids rate limits and result instability from government servers)
    - cron: "0 2 * * 0"
  workflow_dispatch:  # allow manual trigger

jobs:
  link-check:
    name: Check source URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lychee (fast link checker)
        run: |
          curl -sL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/

      - name: Check links in sources/ and skills/
        # --exclude: skip anchors and localhost
        # --timeout: government sites can be slow
        # --max-retries: retry transient failures
        # --no-progress: cleaner CI output
        run: |
          lychee \
            --exclude "^#" \
            --exclude "localhost" \
            --timeout 30 \
            --max-retries 3 \
            --no-progress \
            --accept 200,429 \
            "sources/**/*.md" "skills/**/*.md"
        continue-on-error: true  # link failures are informational, not blocking

      - name: Summary
        run: echo "Link check complete. Review output above for broken links in sources."
