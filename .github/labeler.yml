documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG*'
      - 'LICENSE*'

legal-sources:
  - changed-files:
    - any-glob-to-any-file:
      - 'sources/**'
      - 'datasets/**'

prompts:
  - changed-files:
    - any-glob-to-any-file: 'prompts/**'

examples:
  - changed-files:
    - any-glob-to-any-file:
      - 'examples/**'
      - 'skills/**'

scripts:
  - changed-files:
    - any-glob-to-any-file: 'scripts/**'

github-actions:
  - changed-files:
    - any-glob-to-any-file: '.github/**'
